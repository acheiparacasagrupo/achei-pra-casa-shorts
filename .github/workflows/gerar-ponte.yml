name: Gerar video-ponte

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ponte:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q edge-tts==7.3.1 pillow requests
      - name: Gerar video-ponte
        run: python ponte.py
      - name: Salvar no repositorio
        run: |
          mkdir -p ponte && cp out/ponte.mp4 ponte/ponte.mp4
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add ponte/ponte.mp4 && git commit -m "Video-ponte gerado" && git push
